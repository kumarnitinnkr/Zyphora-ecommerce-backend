version: '3.9'

services:

  mysql:
    image: mysql:8
    container_name: zyphora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zyphora_db
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: zyphora-app
    depends_on:
      - mysql
    ports:
      - "8080:8080"