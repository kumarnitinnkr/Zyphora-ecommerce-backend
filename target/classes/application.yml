server:
  address: 0.0.0.0
  port: 8080

# server:
#   port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zyphora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: MySQL@123        # ← your MySQL password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  # ── EMAIL (Gmail SMTP) ──────────────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username:       # ← your Gmail address
    password:         # ← Gmail App Password (not your Gmail login password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: mySuperSecretKeyForZyphoraJWTToken123456
  access-expiration: 900000
  refresh-expiration: 604800000

# ── TWILIO (WhatsApp + SMS) ─────────────────────────────────────────────────

# ── NOTIFICATION SWITCHES — set true/false to enable/disable each ───────────
notify:
  email:    true
  

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
